[package]
name = "jcode_wordcraft_preview"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# Prepared at the pinned upstream workspace's jcode-preview/ by bundle/wordcraft.ts.
[dependencies]
wordcraft-doc = { path = "../crates/doc" }
wordcraft-docx = { path = "../crates/docx" }
wordcraft-fonts = { path = "../crates/fonts" }
wordcraft-layout = { path = "../crates/layout" }
wordcraft-render = { path = "../crates/render" }
serde = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
wasm-bindgen = "=0.2.129"

[dev-dependencies]
image = { workspace = true }
